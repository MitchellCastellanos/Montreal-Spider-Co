name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: msc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database (the name must contain msc_test — the integration tests refuse any other).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/msc_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/msc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      # Non-blocking for now: the baseline has 11 pre-existing react-hooks lint errors unrelated to CI setup.
      # Remove `continue-on-error` once they are fixed.
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
      - run: npx prisma db push --skip-generate
      - run: npm test
